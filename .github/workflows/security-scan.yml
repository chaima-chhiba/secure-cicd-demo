name: Secure CI/CD Pipeline

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  security-events: write
  contents: read
  actions: read

jobs:
  gitleaks:
    name: Gitleaks Secrets Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    needs: gitleaks
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Run Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: p/python
          publishToken: ${{ secrets.SEMGREP_APP_TOKEN }}

  dependency-check:
    name: OWASP Dependency-Check
    runs-on: ubuntu-latest
    needs: gitleaks
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Run OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: secure-cicd-demo
          path: .
          format: HTML
          args: --failOnCVSS 9 --enableRetired
      - name: Upload Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-report
          path: reports/

  trivy-scan:
    name: Trivy Docker Image Scan
    runs-on: ubuntu-latest
    needs: gitleaks
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t secure-cicd-demo:${{ github.sha }} .
      - name: Run Trivy scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: secure-cicd-demo:${{ github.sha }}
          format: table
          exit-code: 1
          ignore-unfixed: true
          severity: CRITICAL
          scanners: vuln
          vuln-type: os
      - name: Trivy SARIF output
        uses: aquasecurity/trivy-action@master
        if: always()
        with:
          image-ref: secure-cicd-demo:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          scanners: vuln
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif

  dast:
    name: OWASP ZAP DAST
    runs-on: ubuntu-latest
    needs: gitleaks
    steps:
      - name: Start isolated Juice Shop target
        run: |
          docker run --detach \
            --name juice-shop \
            --publish 3000:3000 \
            bkimminich/juice-shop:v17.1.1

      - name: Wait for target
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000 > /dev/null; then
              exit 0
            fi
            sleep 5
          done
          docker logs juice-shop
          exit 1

      - name: Run ZAP baseline scan
        run: |
          docker run --network host --rm \
            --volume "${{ github.workspace }}:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://127.0.0.1:3000 \
            -r zap-report.html \
            -I

      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: zap-report.html

      - name: Stop Juice Shop target
        if: always()
        run: docker rm --force juice-shop

  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    needs: trivy-scan
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t secure-cicd-demo:${{ github.sha }} .
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: secure-cicd-demo:${{ github.sha }}
          format: spdx-json
          output-file: sbom.spdx.json
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-report
          path: sbom.spdx.json

  push-image:
    name: Push Image to Docker Hub
    runs-on: ubuntu-latest
    needs: [semgrep, dependency-check, trivy-scan, dast]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/secure-cicd-demo:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/secure-cicd-demo:${{ github.sha }}
